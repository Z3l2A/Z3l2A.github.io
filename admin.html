<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Required</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input, button { padding: 0.5rem 1rem; margin-top: 1rem; font-size: 1rem; }
        button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .error { color: red; margin-top: 0.5rem; display: none; }
    </style>    
</head>
<body>

<div class="card">
    <h2>ENTER ACCESS CODE</h2>
    <input type="password" id="accessCode" placeholder="Enter Code">
    <br>
    <button id="submitBtn">Submit</button>
    <p id="errorMsg" class="error">Invalid Access Code</p>
</div>

<script>
    // Dictionary mapping access codes to their respective URLs
    const accessRoutes = {
        "CUPS": "https://[2a02:908:1347:bce0:18c0:4dff:fe3b:b6f0]:631/",
        "USER": "https://1drv.ms/w/c/ac5cc98241a40a0e/IQCd8xI8ffmnSbO-9jKd05pkAW_xsUEMzRFe1YVsyVJVIlg",
        "EDIT": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/admin.html",
		"PLAY": "https://z3l2a.github.io/Pong.html",
		"    ": "about:blank"
    };

    document.getElementById("submitBtn").addEventListener("click", function() {
        const userInput = document.getElementById("accessCode").value.trim();
        const targetUrl = accessRoutes[userInput];

        if (targetUrl) {
            document.getElementById("errorMsg").style.display = "none";
            window.location.href = targetUrl;
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    });

    document.getElementById("accessCode").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            document.getElementById("submitBtn").click();
        }
    });
</script>

</body>
</html>
