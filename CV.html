    <style>
        :root {
            --bg-color: #FFFFFF;
            --text-color: #000000;
            --input-bg: #F9F9F9;
            --input-readonly-bg: #F0F0F0;
            --accent-color: #FF00FF;
            --accent-hover: #D400D4;
            --copy-btn-bg: #28a745;
            --copy-btn-hover: #218838;
            --download-btn-bg: #008CBA;
            --download-btn-hover: #007399;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #E0E0E0;
            --input-bg: #1E1E1E;
            --input-readonly-bg: #2A2A2A;
            --accent-color: #FF00FF;
            --accent-hover: #E000E0;
            --copy-btn-bg: #218838;
            --copy-btn-hover: #1e7e34;
            --download-btn-bg: #007399;
            --download-btn-hover: #005c7a;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            font-size: 20px;
            margin: 20px;
            accent-color: var(--accent-color);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #themeToggle {
            width: auto;
            padding: 8px 16px;
            font-size: 16px;
            margin: 0;
        }

        ::selection {
            background-color: var(--accent-color);
            color: #FFFFFF;
        }

        h1 {
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
        }

        textarea, input[type="file"], button {
            width: 100%;
            font-size: 20px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-color);
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        textarea[readonly] {
            background-color: var(--input-readonly-bg);
        }

        button {
            background-color: var(--accent-color);
            color: #FFFFFF;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .fit-picture {
            max-width: 100%;
            height: auto;
            display: block;
        }

        #qrcode {
            margin-top: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        #qrcode img, #qrcode canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            background-color: #FFFFFF;
            padding: 12px;
            border-radius: 4px;
        }

        .counter {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-download {
            display: none;
            background-color: var(--download-btn-bg);
            border-color: var(--download-btn-bg);
        }

        .btn-download:hover {
            background-color: var(--download-btn-hover);
        }

        .btn-copy {
            background-color: var(--copy-btn-bg);
            border-color: var(--copy-btn-bg);
            margin-top: 2px;
            margin-bottom: 20px;
        }

        .btn-copy:hover {
            background-color: var(--copy-btn-hover);
        }
    </style>
</head>

ul li a {

  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover {

}
</style>
