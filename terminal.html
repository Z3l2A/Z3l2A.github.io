<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ocs-site-verification" content="ba9c3ee6ab1613351182e9a1558fa6ae">
    <link rel="icon" href="https://z3l2a.github.io/favicon.ico" sizes="any">
    <title>TERMINAL — Z3l2A</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f8f9fa;
            --input-bg: #ffffff;
            --accent-color: #d600d6;
            --accent-hover: #b000b0;
            --border-color: #e0e0e0;
            --nav-bg: #f0f0f0;
            --error-color: #e53935;
            --shadow-color: rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent-color: #ff00ff;
            --accent-hover: #d600d6;
            --border-color: #333333;
            --nav-bg: #1e1e1e;
            --error-color: #ff5252;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
        }

        nav a:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        #themeToggle {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        #themeToggle:hover {
            background-color: var(--accent-hover);
        }

        /* Main Container & Terminal Card */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 8px;
            box-shadow: 0 8px 24px var(--shadow-color);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card h2 {
            font-family: "Consolas", "Courier New", Courier, monospace;
            font-size: 22px;
            letter-spacing: 1.5px;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-family: "Consolas", "Courier New", Courier, monospace;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            font-family: "Consolas", "Courier New", Courier, monospace;
            letter-spacing: 1px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button.submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .error {
            color: var(--error-color);
            font-family: "Consolas", "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 0;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="dark-mode">

    <nav>
        <a href="https://z3l2a.github.io/index.html">'go back to HOME /'</a>
        <button id="themeToggle" onclick="toggleTheme()">☀️ Light Mode</button>
    </nav>

    <main>
        <div class="card">
            <h2>ENTER ACCESS CODE</h2>
            <div class="input-group">
                <input type="password" id="accessCode" placeholder="ACCESS CODE" autofocus autocomplete="off">
                <button id="submitBtn" class="submit-btn">ENTER</button>
            </div>
            <p id="errorMsg" class="error">ACCESS DENIED!</p>
        </div>
    </main>

    <script>
        // Mapping access codes (stored in uppercase for case-insensitive matching)
        const accessRoutes = {
            "0": "about:blank",
            "CV": "https://1drv.ms/w/c/ac5cc98241a40a0e/IQCd8xI8ffmnSbO-9jKd05pkAW_xsUEMzRFe1YVsyVJVIlg",
            "INDEX": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/index.html",
            "LICENSE": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/LICENSE.html",
            "LINKEDIN": "https://www.linkedin.com/in/vincentgaertner/",
            "MAIL": "mailto:VincentGaertner@outlook.de",
            "..": "https://z3l2a.github.io/index.html",
            "PONG": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/pong.html",
            "README": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/README.md",
            "ROOT": "https://github.com/Z3l2A/Z3l2A.github.io/",
            "TERMINAL": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/terminal.html",
            "TOOLS": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/tools.html",
            "TSW": "https://github.com/Z3l2A/Z3l2A.github.io/edit/Z3l2A.github.io/tsw.html",
            "YOUTUBE": "https://youtube.com/@Vincent_Gaertner"
        };

        const inputField = document.getElementById("accessCode");
        const submitBtn = document.getElementById("submitBtn");
        const errorMsg = document.getElementById("errorMsg");

        function processAccess() {
            const userInput = inputField.value.trim().toUpperCase();
            const targetUrl = accessRoutes[userInput];

            if (targetUrl) {
                errorMsg.style.display = "none";
                window.location.href = targetUrl;
            } else {
                errorMsg.style.display = "block";
                inputField.select();
            }
        }

        submitBtn.addEventListener("click", processAccess);

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                processAccess();
            }
        });

        // Clear error message when user starts typing again
        inputField.addEventListener("input", function() {
            errorMsg.style.display = "none";
        });

        // Theme Switcher Logic
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                updateThemeButton(true);
            } else {
                document.body.classList.remove('dark-mode');
                updateThemeButton(false);
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeButton(isDark);
        }

        function updateThemeButton(isDark) {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</body>
</html>
